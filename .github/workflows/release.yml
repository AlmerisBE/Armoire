name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Téléchargement des dépendances Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restauration des dépendances
        run: dotnet restore

      - name: Compilation en configuration Release
        run: dotnet build --configuration Release --no-restore

      - name: Création de la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: Armoire/bin/x64/Release/Armoire/latest.zip
          generate_release_notes: true