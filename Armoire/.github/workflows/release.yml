name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Téléchargement des dépendances Dalamud
        uses: goatcorp/setup-dalamud@v3
        with:
          branch: 'v11'

      - name: Restauration des dépendances
        run: dotnet restore

      - name: Compilation en configuration Release
        run: dotnet build --configuration Release --no-restore

      - name: Préparation de l'archive ZIP
        run: |
          Compress-Archive -Path "Armoire/bin/Release/Armoire/*" -DestinationPath "latest.zip" -Force

      - name: Création de la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: latest.zip
          generate_release_notes: true